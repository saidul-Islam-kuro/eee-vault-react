backend:
  name: github
  repo: saidul-Islam-kuro/eee-vault-react
  branch: main
  base_url: https://eee-vault-jstu.vercel.app
  auth_endpoint: /api/auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "vault"
    label: "Vault Data"
    files:
      - file: "public/data.json"
        label: "Vault Data"
        name: "vault"
        format: "json"
        fields:
          - label: "Courses"
            name: "Course"
            widget: "list"
            summary: "{{fields.semester}} | {{fields.title}} ({{fields.code}})"
            fields:
              - { label: "Semester", name: "semester", widget: "string" }
              - { label: "Course Title", name: "title", widget: "string" }
              - { label: "Course Code", name: "code", widget: "string" }

              - label: "Session Papers"
                name: "links"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "20-21", name: "20-21", widget: "list", default: [] }
                  - { label: "21-22", name: "21-22", widget: "list", default: [] }
                  - { label: "22-23", name: "22-23", widget: "list", default: [] }
                  - { label: "23-24", name: "23-24", widget: "list", default: [] }
                  - { label: "24-25", name: "24-25", widget: "list", default: [] }

              - label: "Course Notes"
                name: "notes"
                widget: "list"
                collapsed: true
                fields:
                  - { label: "Note Name", name: "name", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }

              - label: "Video Modules"
                name: "videos"
                widget: "list"
                collapsed: true
                required: false
                hint: "Add a full YouTube playlist with one playlistId, or add individual lecture items."
                fields:
                  - { label: "Module Title", name: "title", widget: "string" }
                  - { label: "Type", name: "type", widget: "string", default: "Playlist", required: false }
                  - { label: "Playlist ID", name: "playlistId", widget: "string", required: false, hint: "Use only the playlist ID, not the full URL. Example: PLBlnK6fEyqRhCuQsNsNXFlCNa_5_jnm1a" }
                  - label: "Lecture Items"
                    name: "classes"
                    widget: "list"
                    required: false
                    fields:
                      - { label: "Item Title", name: "title", widget: "string" }
                      - { label: "YouTube Video ID", name: "videoId", widget: "string", hint: "Example: M7lc1UVf-VE" }
                      - { label: "Type", name: "type", widget: "string", default: "Lecture", required: false }

          - label: "Library Books"
            name: "Library"
            widget: "list"
            summary: "{{fields.title}} — {{fields.author}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Author", name: "author", widget: "string" }
              - { label: "Edition", name: "edition", widget: "string", required: false }
              - { label: "Category", name: "category", widget: "string", required: false }
              - { label: "Book URL", name: "url", widget: "string" }
